<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aled’s Cars · Original and visual</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui;color:#173c43;background:#f5f2e9;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:#f5f2e9;border-bottom:1px solid #d9dfd7;flex-wrap:wrap}h1{font-size:15px;margin:0;flex:1}a{color:inherit;text-underline-offset:3px}header>a{font-size:12px}button,select{font:inherit}button{border:0;border-radius:20px;padding:8px 14px;color:inherit;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#173c43;color:white}.editions{border:1px solid #bccfc2;border-radius:24px;padding:3px}select{padding:8px 10px;border:1px solid #bccfc2;border-radius:6px;background:white;color:inherit;max-width:270px}main{flex:1;min-height:400px}iframe{width:100%;height:100%;border:0;display:block}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #cc784d;outline-offset:3px}.label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{gap:10px;padding:12px}h1{flex-basis:70%;font-size:16px}.editions{order:2}label{order:3;flex:1;min-width:0}select{width:100%;max-width:none;font-size:12px}#direct{display:none}#read{font-weight:700}}</style><body><header><a href="../">← Collection</a><h1>Aled’s Cars</h1><div class="editions" role="group" aria-label="Presentation edition"><button data-edition="original" aria-pressed="false">Original</button><button data-edition="visual" aria-pressed="true">Visual</button></div><label><span class="label">Choose a slide</span><select id="topic" aria-label="Choose a slide"></select></label><a id="direct" href="visual/index.html" target="_blank" rel="noopener">Open stage</a><a id="read" href="visual/index.html?view=read" target="_blank" rel="noopener">Read</a></header><main><iframe id="deck" title="Aled’s Cars" src="visual/index.html" allow="fullscreen" allowfullscreen></iframe></main><script type="application/json" id="comparison-data">{"title":"Aled’s Cars","slides":[{"id":"your-day","title":"Aled’s Cars · Service & care","route":"main"},{"id":"the-question","title":"The question","route":"main"},{"id":"on-the-website","title":"Start on the website","route":"main"},{"id":"start-the-conversation","title":"Talk it through","route":"main"},{"id":"check-the-arrangements","title":"Check the arrangements","route":"main"},{"id":"ask-check-confirm","title":"A clear distinction","route":"main"},{"id":"after-the-check","title":"After the check","route":"main"},{"id":"a-useful-answer","title":"The useful answer","route":"main"},{"id":"lets-talk","title":"Aled’s Cars · Questions","route":"main"},{"id":"before-you-make-plans","title":"Before you make plans","route":"backup"}]}</script><script>// Comparison shell selects an edition. The embedded engines own all progression.
(()=>{
 const data=JSON.parse(document.getElementById('comparison-data').textContent),select=document.getElementById('topic'),frame=document.getElementById('deck');
 const ids=new Set(data.slides.map(s=>s.id));let edition='visual',id=data.slides[0].id;
 const initial=location.hash.slice(1).split('/');if(['original','visual'].includes(initial[0]))edition=initial[0];if(ids.has(initial[1]))id=initial[1];
 for(const s of data.slides){const option=new Option((s.route==='backup'?'Q&A · ':'')+s.title,s.id);select.add(option);}
 function reflect(){select.value=id;for(const b of document.querySelectorAll('[data-edition]'))b.setAttribute('aria-pressed',String(b.dataset.edition===edition));history.replaceState(null,'','#'+edition+'/'+id);document.getElementById('direct').href='visual/index.html#/'+id;document.getElementById('read').href='visual/index.html?view=read#'+id;frame.title=(edition==='visual'?'Visual':'Original')+' · '+data.title;}
 function load(){reflect();frame.src=edition+'/index.html#'+(edition==='visual'?'/':'')+id;}
 for(const b of document.querySelectorAll('[data-edition]'))b.onclick=()=>{edition=b.dataset.edition;load();};select.onchange=()=>{id=select.value;load();};
 frame.addEventListener('load',()=>{try{const win=frame.contentWindow;const changed=()=>{const next=decodeURIComponent(win.location.hash.replace(/^#\/?/,'')).split('/')[0];if(ids.has(next)){id=next;reflect();}};win.addEventListener('hashchange',changed);changed();}catch{}});load();
})();
</script></body></html>
