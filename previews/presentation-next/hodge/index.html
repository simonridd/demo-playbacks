<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hodge Bank · Original and visual</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui;color:#173c43;background:#f5f2e9;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:#f5f2e9;border-bottom:1px solid #d9dfd7;flex-wrap:wrap}h1{font-size:15px;margin:0;flex:1}a{color:inherit;text-underline-offset:3px}header>a{font-size:12px}button,select{font:inherit}button{border:0;border-radius:20px;padding:8px 14px;color:inherit;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#173c43;color:white}.editions{border:1px solid #bccfc2;border-radius:24px;padding:3px}select{padding:8px 10px;border:1px solid #bccfc2;border-radius:6px;background:white;color:inherit;max-width:270px}main{flex:1;min-height:400px}iframe{width:100%;height:100%;border:0;display:block}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #cc784d;outline-offset:3px}.label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{gap:10px;padding:12px}h1{flex-basis:70%;font-size:16px}.editions{order:2}label{order:3;flex:1;min-width:0}select{width:100%;max-width:none;font-size:12px}#direct{display:none}#read{font-weight:700}}</style><body><header><a href="../">← Collection</a><h1>Hodge Bank</h1><div class="editions" role="group" aria-label="Presentation edition"><button data-edition="original" aria-pressed="false">Original</button><button data-edition="visual" aria-pressed="true">Visual</button></div><label><span class="label">Choose a slide</span><select id="topic" aria-label="Choose a slide"></select></label><a id="direct" href="visual/index.html" target="_blank" rel="noopener">Open stage</a><a id="read" href="visual/index.html?view=read" target="_blank" rel="noopener">Read</a></header><main><iframe id="deck" title="Hodge Bank" src="visual/index.html" allow="fullscreen" allowfullscreen></iframe></main><script type="application/json" id="comparison-data">{"title":"Hodge Bank","slides":[{"id":"welcome","title":"Hodge Bank · 27 October 2026","route":"main"},{"id":"what-is-social-listening","title":"The basics","route":"main"},{"id":"analytics-and-escalation","title":"What you can do in Genesys","route":"main"},{"id":"savings-interest","title":"Scenario 1 · Ready to save","route":"main"},{"id":"savings-escalation","title":"Scenario 1 · The handoff","route":"main"},{"id":"savings-response","title":"Scenario 1 · A helpful response","route":"main"},{"id":"customer-voice","title":"Scenario 2 · A reason to act sooner","route":"main"},{"id":"listening-priorities","title":"Scenario 2 · Why this would escalate","route":"main"},{"id":"human-response","title":"Scenario 2 · The response","route":"main"},{"id":"hodge-context","title":"Why this fits Hodge","route":"main"},{"id":"coverage-boundary","title":"Channel coverage","route":"main"},{"id":"ownership","title":"The people around the technology","route":"main"},{"id":"pilot","title":"A pilot to discuss","route":"main"},{"id":"success","title":"How we would judge it","route":"main"},{"id":"discussion","title":"Your view","route":"main"},{"id":"listening-and-care","title":"The distinction","route":"backup"},{"id":"genesys-flow","title":"How it fits together","route":"backup"},{"id":"coverage-detail","title":"Coverage detail","route":"backup"},{"id":"setup-questions","title":"Before a pilot","route":"backup"}]}</script><script>// Comparison shell selects an edition. The embedded engines own all progression.
(()=>{
 const data=JSON.parse(document.getElementById('comparison-data').textContent),select=document.getElementById('topic'),frame=document.getElementById('deck');
 const ids=new Set(data.slides.map(s=>s.id));let edition='visual',id=data.slides[0].id;
 const initial=location.hash.slice(1).split('/');if(['original','visual'].includes(initial[0]))edition=initial[0];if(ids.has(initial[1]))id=initial[1];
 for(const s of data.slides){const option=new Option((s.route==='backup'?'Q&A · ':'')+s.title,s.id);select.add(option);}
 function reflect(){select.value=id;for(const b of document.querySelectorAll('[data-edition]'))b.setAttribute('aria-pressed',String(b.dataset.edition===edition));history.replaceState(null,'','#'+edition+'/'+id);document.getElementById('direct').href='visual/index.html#/'+id;document.getElementById('read').href='visual/index.html?view=read#'+id;frame.title=(edition==='visual'?'Visual':'Original')+' · '+data.title;}
 function load(){reflect();frame.src=edition+'/index.html#'+(edition==='visual'?'/':'')+id;}
 for(const b of document.querySelectorAll('[data-edition]'))b.onclick=()=>{edition=b.dataset.edition;load();};select.onchange=()=>{id=select.value;load();};
 frame.addEventListener('load',()=>{try{const win=frame.contentWindow;const changed=()=>{const next=decodeURIComponent(win.location.hash.replace(/^#\/?/,'')).split('/')[0];if(ids.has(next)){id=next;reflect();}};win.addEventListener('hashchange',changed);changed();}catch{}});load();
})();
</script></body></html>
