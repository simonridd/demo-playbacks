name: Publish verified comparative-quote AXL preview
on:
  push:
    branches: [codex/axl-edu9-publish]
permissions:
  contents: write
concurrency:
  group: publish-axl-edu9
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6d30-81f4-a51a-594e52df2537/raw?se=2026-10-25T06%3A54%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=c9ae96cf-d5bf-57a8-a612-3dfd13669ea3&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-25T02%3A16%3A58Z&ske=2026-10-26T02%3A16%3A58Z&sks=b&skv=2026-02-06&sig=d7tIkZMcJv7VYBBgVz8qXtD1OxLMjUA7UBK955kyV5c%3D'
      EXPECTED_SHA256: cc3c15f21782d3c4d886ac148ffd526388a39e022f352e60162e1618b0cca127
      TARGET: previews/axl-bot-ava-matrix-2026-10-29/index.html
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate private CI artifact
        run: |
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/audience.zip
          mkdir -p /tmp/audience
          unzip -q /tmp/audience.zip -d /tmp/audience
          HTML=$(find /tmp/audience -type f -name index.html | head -n 1)
          test -n "$HTML"
          echo "$EXPECTED_SHA256  $HTML" | sha256sum --check --status
          cp "$HTML" /tmp/axl-index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/axl-index.html')
          text=p.read_text(encoding='utf-8')
          sections=re.findall(r'<section class="slide [^"]*"[^>]*data-route="(main|backup)"[^>]*id="([^"]+)"|<section class="slide [^"]*" id="([^"]+)"[^>]*data-route="(main|backup)"',text)
          routes=[(a or d,b or c) for a,b,c,d in sections]
          assert len(routes)==31, len(routes)
          assert sum(r=='main' for r,_ in routes)==18, routes
          assert sum(r=='backup' for r,_ in routes)==13, routes
          for phrase in [
              'Can you get me another option so I can compare?',
              'A LAM is trained to choose the next useful action.',
              'One agreed behaviour—used to align, build and prove.',
              'Spec-driven development',
              'AXL in practice',
          ]:
              assert phrase in text, phrase
          for forbidden in ['client_secret','access_token','Authorization: Bearer','127.0.0.1','localhost','ngrok-free.dev']:
              assert forbidden.lower() not in text.lower(), forbidden
          assert not re.findall(r'https?://[^\s"\'<>\)]+',text)
          assert not re.findall(r'<(?:script|link|img|iframe|audio|video)\b[^>]*(?:src|href)=["\'](?:https?:|//|/(?!/))[^>]*>',text,re.I)
          print({'slides':len(routes),'main':sum(r=='main' for r,_ in routes),'backup':sum(r=='backup' for r,_ in routes)})
          PY
      - name: Commit only the verified preview to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "$(dirname "$TARGET")"
          cp /tmp/axl-index.html "$TARGET"
          git diff --check
          if git diff --quiet -- "$TARGET"; then
            echo 'Preview is already current.'
            exit 0
          fi
          git config user.name 'Presentation validation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Publish comparative-quote AXL workshop narrative'
          git push origin main
